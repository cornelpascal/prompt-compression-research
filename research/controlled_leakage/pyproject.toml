[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-leakage"
version = "0.1.0"
description = "Reproducible prompt compression and inversion experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "pydantic>=2.9,<3"]

[project.optional-dependencies]
gpu = ["torch>=2.5,<3", "transformers>=4.56,<6", "peft>=0.15,<1", "accelerate>=1,<2", "sentencepiece>=0.2,<1", "safetensors>=0.5,<1"]
llmlingua = ["llmlingua>=0.2.2,<0.3"]
test = ["pytest>=8,<10"]

[project.scripts]
leaklab = "leaklab.cli:main"

[tool.setuptools.packages.find]
include = ["leaklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
