[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcomp"
version = "0.1.0"
description = "Whole-prompt compression training and reproducible multi-model evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pydantic>=2.9,<3"]

[project.optional-dependencies]
train = ["torch>=2.8,<3", "transformers==4.56.2", "peft==0.17.1", "accelerate==1.10.1", "safetensors>=0.6,<1", "sentencepiece==0.2.1"]
report = ["matplotlib>=3.10,<4"]
baseline = ["llmlingua>=0.2.2,<0.3"]
test = ["pytest>=8,<10"]

[project.scripts]
promptcomp = "promptcomp.cli:main"

[tool.setuptools.packages.find]
include = ["promptcomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

